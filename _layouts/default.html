<!doctype html>
<html lang="{{ page.lang | default: 'he' }}" dir="{{ page.text_dir | default: 'rtl' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — ניקוד לילדים</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
  :root {
    --bg: #000;
    --fg: #f2f2f7;
    --muted: #98989f;
    --line: #2c2c2e;
    --card: #111113;
    --accent: #7aa2ff;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Heebo", Arial, sans-serif;
    padding: 0 20px 80px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  /* Top bar: brand + the language toggle. */
  header.bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 24px 0 8px; border-bottom: 1px solid var(--line);
    margin-bottom: 32px; flex-wrap: wrap;
  }
  .brand {
    font-size: 20px; font-weight: 700; text-decoration: none; color: var(--fg);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .brand .abg {
    background: linear-gradient(90deg,#ff6b6b,#ffd166,#7aa2ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 800;
  }
  .lang {
    display: inline-block; padding: 8px 16px; border: 1px solid var(--line);
    border-radius: 999px; text-decoration: none; color: var(--fg);
    font-size: 15px; font-weight: 600; white-space: nowrap;
    transition: background .15s ease, border-color .15s ease;
  }
  .lang:hover, .lang:focus-visible { background: var(--card); border-color: var(--accent); }

  h1 { font-size: 30px; line-height: 1.25; margin: 0 0 8px; }
  h2 { font-size: 21px; margin: 40px 0 12px; }
  h3 { font-size: 18px; margin: 28px 0 6px; }
  p, li { color: var(--fg); }
  a { color: var(--accent); }
  strong { color: #fff; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }
  ul { padding-inline-start: 22px; }
  li { margin: 6px 0; }

  blockquote {
    margin: 20px 0; padding: 2px 16px; border-inline-start: 3px solid var(--line);
    color: var(--muted);
  }

  /* Tables must scroll on their own; the page body never scrolls sideways. */
  .table-scroll { overflow-x: auto; margin: 20px 0; }
  table { border-collapse: collapse; width: 100%; min-width: 380px; font-size: 15px; }
  th, td {
    border: 1px solid var(--line); padding: 10px 12px;
    text-align: start; vertical-align: top;
  }
  th { background: var(--card); font-weight: 600; }

  .updated { color: var(--muted); font-size: 15px; margin: 0 0 4px; }
  footer {
    margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 14px;
  }
  footer a { color: var(--muted); }

  @media (max-width: 480px) {
    body { font-size: 16px; }
    h1 { font-size: 25px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="abg">אבג</span><span>ניקוד לילדים</span>
    </a>
    {% if page.alt_url %}
      <a class="lang" href="{{ page.alt_url | relative_url }}" lang="{{ page.alt_lang }}">{{ page.alt_label }}</a>
    {% endif %}
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>
      © 2026 Guy Ben Moshe ·
      <a href="{{ '/privacy-policy' | relative_url }}">מדיניות פרטיות</a> ·
      <a href="{{ '/support' | relative_url }}">תמיכה</a> ·
      <a href="{{ '/privacy-policy-en' | relative_url }}">English</a>
    </p>
  </footer>
</div>
<script>
  // Tables come from Markdown, so they can't carry a wrapper class. Add the
  // horizontal-scroll container here instead of hand-writing HTML tables.
  document.querySelectorAll('table').forEach(function (t) {
    if (t.parentElement.classList.contains('table-scroll')) return;
    var d = document.createElement('div');
    d.className = 'table-scroll';
    t.parentNode.insertBefore(d, t);
    d.appendChild(t);
  });
</script>
</body>
</html>
